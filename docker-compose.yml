version: '3.8'

services:
  aura-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura-communication-platform:latest
    container_name: aura-platform
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=aura_super_secure_production_key_change_me
    volumes:
      # Persistência do banco de dados na máquina host
      - ./data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
